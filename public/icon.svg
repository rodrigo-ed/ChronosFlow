<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="chronosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#chronosGrad)" />
  <!-- Inner calendar frame -->
  <rect x="96" y="112" width="320" height="304" rx="36" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8" />
  <!-- Calendar header bar -->
  <path d="M96 176 H416" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" />
  <!-- Binder rings -->
  <circle cx="160" cy="112" r="14" fill="#FFFFFF" />
  <circle cx="352" cy="112" r="14" fill="#FFFFFF" />
  <!-- Dynamic checkmark & clock needle -->
  <path d="M168 280 L224 336 L344 216" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Small glowing productivity star -->
  <circle cx="380" cy="140" r="18" fill="url(#accentGrad)" />
</svg>
